name: Verify loop-decoupling ablation

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "GHCR image digest (sha256:...)"
        required: true
        type: string
      max_insts:
        description: "Maximum instructions per restored run"
        required: true
        default: "10000000"
        type: string
      tasks:
        description: "Optional space-separated task names"
        required: false
        type: string
      validate_reference:
        description: "Compare with frozen reference results"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  mechanism:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pull immutable image
        env:
          IMAGE: ghcr.io/forzacapybara/ldp-gem5-ae@${{ inputs.image_digest }}
        run: docker pull "$IMAGE"

      - name: Run baseline and loop-decoupling ablation
        env:
          IMAGE: ghcr.io/forzacapybara/ldp-gem5-ae@${{ inputs.image_digest }}
          MAX_INSTS: ${{ inputs.max_insts }}
          TASKS: ${{ inputs.tasks }}
        run: |
          mkdir results
          task_args=()
          if [[ -n "$TASKS" ]]; then
            read -r -a selected_tasks <<< "$TASKS"
            task_args=(--tasks "${selected_tasks[@]}")
          fi
          /usr/bin/time -v docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/results:/results" \
            -v "$PWD/scripts/run.py:/opt/ldp/scripts/run.py:ro" \
            -v "$PWD/scripts/mechanism.py:/opt/ldp/scripts/mechanism.py:ro" \
            -v "$PWD/scripts/plot_mechanism.py:/opt/ldp/scripts/plot_mechanism.py:ro" \
            "$IMAGE" \
            python3 scripts/run.py \
              --gem5 /opt/ldp/bin/gem5.opt \
              --checkpoint-root /opt/ldp/checkpoints \
              --outdir /results --jobs 4 \
              --max-insts "$MAX_INSTS" --mechanism-ablation \
              "${task_args[@]}"

      - name: Validate original speedup results
        if: inputs.validate_reference
        env:
          IMAGE: ghcr.io/forzacapybara/ldp-gem5-ae@${{ inputs.image_digest }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/results:/results:ro" \
            "$IMAGE" \
            python3 scripts/validate.py \
              --actual /results/analysis/speedup.csv \
              --output-root /results

      - name: Validate mechanism results
        if: inputs.validate_reference
        run: |
          python3 scripts/validate_mechanism.py \
            --actual results/analysis/mechanism_summary.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanism-results
          path: results
          retention-days: 30
